name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly run against the latest release of every dependency, so API
    # removals upstream surface here before readers hit them.
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project with all extras
        run: pip install -e ".[all,dev]"
      - name: Run unit and reference tests
        run: pytest tests --ignore=tests/smoke -q
      - name: Run smoke tests
        run: pytest tests/smoke -n auto -q -rs --durations=15
